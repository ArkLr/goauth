<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account · GoAuth</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="brand-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
      GoAuth
    </div>

    <h1>Create an account</h1>
    <p class="subtitle">It only takes a few seconds.</p>

    {{with .Error}}
    <div class="alert alert-error" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span>{{.}}</span>
    </div>
    {{end}}

    <form method="POST" action="/register">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@example.com" autocomplete="email" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" minlength="8" maxlength="72" required>
          <button type="button" class="toggle-password" aria-label="Show password" data-target="password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="hint">Between 8 and 72 characters.</p>
      </div>

      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p class="footer-text">Already have an account? <a href="/login">Sign in</a></p>
  </main>

  <script>
    document.querySelectorAll(".toggle-password").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = document.getElementById(btn.dataset.target);
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    });
  </script>
</body>
</html>
