<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Edit post · GoAuth</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
		<link rel="stylesheet" href="/static/style.css" />
	</head>
	<body>
		<main class="card wide">
			<div class="card-body">
				<a class="back-link" href="/posts">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="m15 18-6-6 6-6" />
					</svg>
					Back to posts
				</a>

				<h1>Edit post</h1>
				<p class="subtitle">Update the headline or body, then save your changes.</p>

				{{with .Error}}
				<div class="alert alert-error" role="alert">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="10" />
						<path d="M12 8v4M12 16h.01" />
					</svg>
					<span>{{.}}</span>
				</div>
				{{end}}

				<form method="POST" action="/posts/{{.Post.Id}}">
					<input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />

					<div class="field">
						<label for="headline">Headline</label>
						<input type="text" id="headline" name="headline" maxlength="200" value="{{.Headline}}" required autofocus />
					</div>

					<div class="field">
						<label for="body">Body</label>
						<textarea id="body" name="body" rows="8" required>{{.Body}}</textarea>
					</div>

					<button type="submit" class="btn btn-primary">Save changes</button>
				</form>
			</div>

			<div class="card-footer"><a href="/posts">Cancel</a></div>
		</main>
	</body>
</html>
