<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · GoAuth</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card wide">
    <div class="brand">
      <span class="brand-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
      GoAuth
    </div>

    <div class="welcome">
      <div class="avatar">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </div>
      <div>
        <h1>You're signed in</h1>
        {{with .Email}}<p>{{.}}</p>{{end}}
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Status</div>
        <div class="stat-value"><span class="badge">Active session</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">User ID</div>
        <div class="stat-value">#{{.UserID}}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Session expires</div>
        <div class="stat-value">{{.ExpiresAt.Format "Jan 2, 2006 · 15:04"}}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Security</div>
        <div class="stat-value">HttpOnly cookie</div>
      </div>
    </div>

    <form method="POST" action="/logout">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button type="submit" class="btn btn-outline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign out
      </button>
    </form>
  </main>
</body>
</html>
