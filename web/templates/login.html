<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign in · GoAuth</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
		<link rel="stylesheet" href="/static/style.css" />
		<script src="/static/auth.js" defer></script>
	</head>
	<body>
		<main class="card">
			<div class="card-body">
				<h1>Sign in to GoAuth</h1>
				<p class="subtitle">Enter your email and password to continue.</p>

				{{with .Error}}
				<div class="alert alert-error" role="alert">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="10" />
						<path d="M12 8v4M12 16h.01" />
					</svg>
					<span>{{.}}</span>
				</div>
				{{end}}

				{{with .Success}}
				<div class="alert alert-success" role="status">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="10" />
						<path d="m8 12 3 3 5-6" />
					</svg>
					<span>{{.}}</span>
				</div>
				{{end}}

				<form method="POST" action="/login" novalidate>
					<div class="field">
						<label for="email">Email</label>
						<input type="email" id="email" name="email" value="{{.Email}}" placeholder="name@example.com" autocomplete="email" required autofocus />
					</div>

					<div class="field">
						<label for="password">Password</label>
						<div class="input-wrap">
							<input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
							<button type="button" class="toggle-password" data-target="password" aria-label="Show password" aria-pressed="false">
								<svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
									<circle cx="12" cy="12" r="3" />
								</svg>
								<svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.2" />
									<path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6" />
									<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
									<path d="m2 2 20 20" />
								</svg>
							</button>
						</div>
					</div>

					<button type="submit" class="btn btn-primary">Continue</button>
				</form>
			</div>

			<div class="card-footer">No account? <a href="/register">Sign up</a></div>
		</main>
	</body>
</html>
